<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Troubleshooting Common Problems</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #5b6573;
      --brand: #4f7cff;
      --brand-dark: #365fd8;
      --accent: #eaf1ff;
      --border: #d9e2f2;
      --shadow: 0 8px 24px rgba(31, 42, 55, 0.08);
      --radius: 18px;
      --warn: #fff4e5;
      --warn-border: #ffd8a8;
      --warn-text: #9a5b00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 18%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.55;
    }
    .page { max-width: 1100px; margin: 0 auto; padding: 28px 18px 56px; }
    .hero {
      background: linear-gradient(135deg, var(--brand) 0%, #6a8cff 100%);
      color: white;
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .home-link { display: inline-block; color: white; font-weight: 700; text-decoration: none; }
    .home-link:hover, .home-link:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
    h1 { margin: 8px 0 10px; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.1; }
    .subtitle { max-width: 760px; margin: 0; font-size: 1.05rem; opacity: 0.96; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .pill { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.24); padding: 8px 12px; border-radius: 999px; font-size: 0.92rem; white-space: nowrap; }
    .top-right {
      min-width: 260px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 18px;
      padding: 14px 16px;
    }
    .top-right .label { color: rgba(255,255,255,0.78); }
    .top-right .value { color: white; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-top: 18px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .card-header { padding: 16px 18px; border-bottom: 1px solid var(--border); background: #fbfcff; font-weight: 700; }
    .card-body { padding: 18px; }
    .span-12 { grid-column: span 12; }
    .span-8 { grid-column: span 8; }
    .span-6 { grid-column: span 6; }
    .span-4 { grid-column: span 4; }
    @media (max-width: 900px) { .span-8, .span-6, .span-4 { grid-column: span 12; } }
    .info-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
    .info-item { background: #f9fbff; border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
    .value { font-weight: 700; }
    .muted { color: var(--muted); }
    .tag { display: inline-block; background: #edf4ff; color: #2f5fd4; border: 1px solid #d7e4ff; border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; margin: 4px 6px 0 0; }
    .callout { background: var(--accent); border: 1px solid #cfe0ff; border-radius: 16px; padding: 14px 16px; }
    .firmware-link { display: inline-block; margin-top: 8px; padding: 9px 12px; color: white; font-weight: 700; text-decoration: none; background: var(--brand-dark); border-radius: 10px; }
    .firmware-link:hover, .firmware-link:focus-visible { background: #2849ad; outline: 3px solid rgba(54, 95, 216, 0.25); outline-offset: 2px; }
    .warning { background: var(--warn); border: 1px solid var(--warn-border); color: var(--warn-text); border-radius: 16px; padding: 14px 16px; }
    .accordion { display: grid; gap: 12px; }
    details { border: 1px solid var(--border); border-radius: 16px; background: #fff; overflow: hidden; }
    summary {
      list-style: none;
      cursor: pointer;
      padding: 16px 18px;
      font-weight: 700;
      background: #fafcff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; font-size: 1.25rem; color: var(--brand); line-height: 1; flex: 0 0 auto; }
    details[open] summary::after { content: "–"; }
    .detail-body { padding: 16px 18px 18px; }
    ul, ol { margin: 0; padding-left: 20px; }
    li + li { margin-top: 8px; }
    .steps { display: grid; gap: 12px; }
    .step {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      background: #fff;
    }
    .step-layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 14px; align-items: start; }
    @media (max-width: 700px) { .step-layout { grid-template-columns: 1fr; } }
    .step-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; font-weight: 700; }
    .step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 999px; background: var(--brand); color: white; font-weight: 700; flex: 0 0 auto;
    }
    .gif-box {
      border: 2px dashed #bfd0f5;
      background: linear-gradient(180deg, #fbfdff 0%, #f2f7ff 100%);
      border-radius: 16px;
      min-height: 150px;
      padding: 14px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }
    .gif-box strong { color: var(--text); display: block; margin-bottom: 6px; }
    .gif-tag { display: inline-block; margin-bottom: 10px; padding: 4px 10px; border-radius: 999px; background: #edf4ff; color: #2f5fd4; border: 1px solid #d7e4ff; font-size: 0.82rem; font-weight: 700; }
    .media-box {
      border: 2px dashed #bfd0f5;
      background: #f8fbff;
      border-radius: 18px;
      padding: 16px;
      min-height: 180px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }
    .media-box strong { color: var(--text); }
    .footer-note { margin-top: 18px; color: var(--muted); font-size: 0.92rem; }
    .example-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .example-card { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: white; }
    .example-caption { padding: 14px 16px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-top">
        <div>
          <a class="home-link" href="finch_lessons_index.html" target="_blank" rel="noopener noreferrer">&larr; Back to Curriculum</a>
          <h1 id="lessonTitle">Troubleshooting Common Problems</h1>
          <p class="subtitle" id="lessonSummary">A guide for solving the most common Finch and MakeCode issues without overwhelming students.</p>
        </div>
      </div>
    </header>

    <main class="grid">
      <section class="card span-12">
        <div class="card-header">Common Problems and Fixes</div>
        <div class="card-body">
          <div class="accordion" id="troubleshootingBox"></div>
        </div>
      </section>

    </main>
  </div>

  <script>
    const lessonData = {
      title: 'Troubleshooting Common Problems',
      summary: 'A reference page for commonly encountered issues.',
      problems: [
        {
          title: 'Program continuously running (MakeCode)',
          fix: [
            'Try pressing the button on the back of the micro:bit to reset it. This will stop the program from running unless a forever loop is used.',
            'Otherwise, turn the Finch off.',
            'If you continuously run into this issue, have your students add an "on button A pressed" block to their program with "stop Finch" in the event so that you can easily stop the Finch by pressing button A.'
          ],
        },
        {
          title: 'Program starts right away (MakeCode)',
          fix: [
            'Check to see if there is anything directly under <strong>On Start</strong> because that begins immediately.',
            'Check to see if a forever loop is used, as that will also begin immediately.'
          ]
        },
        {
          title: 'Program is not running (MakeCode)',
          fix: [
            'Ensure that the block "start Finch" is included in the program. This block is required for any program that uses the Finch.',
            'Ensure that the Finch is turned on. The light at the Finches beak turns green when it is turning on and red when it is turning off.'
          ]
        },
        {
          title: 'Program is not downloading (MakeCode)',
          fix: [
            'Unplug the USB mini-B cable from the micro:bit.',
            'Turn the Finch off and back on.',
            'Plug the USB mini-B cable back into the micro:bit and try downloading again.'
          ],
        },
        {
          title: 'Bluetooth name is not showing (FinchBlox)',
          fix: [
            'Download the firmware below.',
            'Connect the micro:bit to the computer using the USB mini‑B cable.',
            'Open the files folder and locate <code>BBTFirmware.hex</code>. ',
            'Right‑click and drag it to the "MICROBIT (D:)" drive to drop it and it will copy over.',
            '<a class="firmware-link" href="BBTFirmware.hex" download="BBTFirmware.hex" target="_blank" rel="noopener noreferrer">Download BBTFirmware.hex</a>'
          ],
          gif: 'Common Steps/MakeCode-to-FinchBlox.gif'
        },
        {
          title: 'Program not running (FinchBlox)',
          fix: [
            'Students may have forgotten to add the "start Finch" block to their program. This block is required for any program that uses the Finch. Either relocate it using the target icon or add a new one from the "Events" category.'
          ]
        },
        {
          title: 'Student unable to find start block (FinchBlox)',
          fix: [
            'If in level 1, it is impossible to delete a start block. Easily find the start block by click the target icon below the zoom in and out buttons on the right hand side or by clicking the gray arrows on the edges of the coding space.',
            'If in level 3, follow the same steps as level 1 to find the start block. If this method does not work, it means the block was deleted and a new one can be added from the "Events" category.'
          ],
          gif: ''
        },
        {
          title: 'Program continuously running (FinchBlox)',
          fix: [
            'Check to see if the a noise event is being used. If so, the program will restart continuously whenever a noise is detected.'
          ]
        }
      ]
    };


    const el = (id) => document.getElementById(id);

    el('lessonTitle').textContent = lessonData.title;
    el('lessonSummary').textContent = lessonData.summary;

    // Helper to generate HTML for a list of problems
    const renderProblems = (problems) => problems.map((problem) => {
      // Remove platform tags like (MakeCode) or (FinchBlox) from the displayed title
      const cleanTitle = problem.title.replace(/\s*\(MakeCode\)/, '').replace(/\s*\(FinchBlox\)/, '');
      return `
      <details>
        <summary>${cleanTitle}</summary>
        <div class="detail-body">
          <div class="step-layout"${problem.gif ? '' : ' style=\"grid-template-columns:1fr;\"'}>
            <div>
              <div class="steps">
                <div class="callout">
                  <strong>Fix</strong>
                  <ul style="margin-top:8px">${problem.fix.map(step => `<li>${step}</li>`).join('')}</ul>
                </div>
              </div>
            </div>
            ${problem.gif ? `<div class="gif-box"><img src="${encodeURI(problem.gif)}" alt="${cleanTitle} animation" loading="lazy" decoding="async" style="max-width:100%;height:auto;" /></div>` : ''}
          </div>
        </div>
      </details>`;
    }).join('');

    const makecodeProblems = lessonData.problems.filter(p => p.title.includes('(MakeCode)'));
    const finchbloxProblems = lessonData.problems.filter(p => p.title.includes('(FinchBlox)'));
    const otherProblems = lessonData.problems.filter(p => !p.title.includes('(MakeCode)') && !p.title.includes('(FinchBlox)'));

    let html = '';
    if (makecodeProblems.length) {
      html += `<h2>MakeCode Problems</h2>` + renderProblems(makecodeProblems);
    }
    if (finchbloxProblems.length) {
      html += `<h2>FinchBlox Problems</h2>` + renderProblems(finchbloxProblems);
    }
    if (otherProblems.length) {
      html += `<h2>Other Problems</h2>` + renderProblems(otherProblems);
    }

    el('troubleshootingBox').innerHTML = html;

  </script>
</body>
</html>
